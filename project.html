<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="臻一人工智能实验室项目档案。">
  <meta name="theme-color" content="#08090b">
  <title>Project | Zhenyi</title>
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="project">
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="page-atmosphere" aria-hidden="true"><i></i><i></i><i></i></div>

  <nav class="site-nav" aria-label="Main navigation">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">Z</span>
        <span class="brand-name">臻一 / Zhenyi</span>
        <small>Project Archive</small>
      </a>
      <div class="nav-links">
        <a href="index.html#enterprise" data-copy="navEnterprise">企业实践</a>
        <a href="index.html#lab" data-copy="navLab">工具与游戏</a>
        <a href="index.html#archive" data-copy="navArchive">其他项目</a>
        <a href="index.html#contact" data-copy="navContact">联系</a>
      </div>
      <div class="lang-switch" aria-label="Language">
        <button type="button" data-lang-button="zh" aria-pressed="true">中</button>
        <button type="button" data-lang-button="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>

  <main>
    <section class="project-hero">
      <div class="container">
        <div class="project-hero-top">
          <a class="back-link" href="index.html#enterprise" data-project-label="back">返回项目列表</a>
          <span class="project-number" id="projectNumber">CASE / 01</span>
        </div>
        <div class="project-hero-grid">
          <div class="project-title-block">
            <span id="projectType" class="project-type"></span>
            <h1 id="projectName"></h1>
            <p id="projectSummary" class="project-summary"></p>
            <div id="projectActions" class="project-actions" hidden></div>
            <div id="projectLaunch" class="project-launch" hidden>
              <img id="projectLaunchQr" src="" alt="" width="128" height="128" loading="eager" decoding="async">
              <div class="project-launch-copy">
                <span id="projectLaunchLabel"></span>
                <strong id="projectLaunchText"></strong>
              </div>
            </div>
          </div>
          <aside id="projectFacts" class="project-facts"></aside>
        </div>
        <div id="projectCurrent" class="project-current" hidden>
          <strong id="projectCurrentTitle"></strong>
          <p id="projectCurrentText"></p>
        </div>
      </div>
    </section>

    <section id="projectVisualSection" class="project-visual-section" hidden>
      <div class="container project-visual-wrap">
        <div class="project-carousel" id="projectCarousel" tabindex="0" aria-label="项目截图轮播">
          <div class="carousel-viewport">
            <div class="carousel-track" id="projectCarouselTrack"></div>
          </div>
          <div class="carousel-bar">
            <div class="carousel-caption" id="projectCarouselCaption"></div>
            <div class="carousel-controls">
              <button type="button" id="carouselPrev" aria-label="上一张">←</button>
              <span id="carouselCount">01 / 01</span>
              <button type="button" id="carouselNext" aria-label="下一张">→</button>
            </div>
          </div>
        </div>
        <div class="visual-margin-note" aria-hidden="true">FIELD<br>PROOF</div>
      </div>
    </section>

    <section class="section project-story">
      <div class="container story-layout">
        <aside class="story-rail">
          <span class="section-index">CASE STUDY</span>
          <p id="storyRailText">问题、产品决策与交付证据。</p>
        </aside>
        <div class="detail-grid">
          <article class="detail-block">
            <small>01 / CONTEXT</small>
            <h2 data-project-label="challenge">要解决的问题</h2>
            <p id="projectChallenge"></p>
          </article>
          <article class="detail-block">
            <small>02 / DECISION</small>
            <h2 data-project-label="approach">怎么做</h2>
            <p id="projectApproach"></p>
          </article>
          <article class="detail-block evidence-block">
            <small>03 / EVIDENCE</small>
            <h2 data-project-label="evidence">已有产物</h2>
            <ul id="projectEvidence"></ul>
          </article>
        </div>
      </div>
    </section>

    <section id="moduleSection" class="section module-section" hidden>
      <div class="container">
        <header class="section-head module-head">
          <span id="moduleIndex" class="section-index">04 / SUITE</span>
          <h2 id="moduleTitle"></h2>
          <p id="moduleIntro"></p>
        </header>
        <div id="moduleList" class="module-list"></div>
      </div>
    </section>

    <section class="next-project-section">
      <div class="container">
        <a id="nextProject" class="next-project" href="index.html#enterprise">
          <span id="nextProjectLabel">NEXT CASE</span>
          <strong id="nextProjectName">返回项目列表</strong>
          <i aria-hidden="true">↗</i>
        </a>
        <div class="back-row">
          <a class="button" href="index.html#enterprise" data-project-label="back">返回项目列表</a>
          <a class="button primary" href="index.html#contact" data-project-label="contact">联系合作</a>
        </div>
      </div>
    </section>
  </main>

  <script src="projects-data.js"></script>
  <script src="site.js"></script>
  <script src="project.js"></script>
</body>
</html>
