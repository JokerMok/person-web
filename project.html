<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="臻一的项目案例。">
  <meta name="theme-color" content="#101210">
  <title>项目 · 臻一</title>
  <link rel="stylesheet" href="site.css?v=20261120">
</head>
<body data-page="project">
  <a class="skip-link" href="#main" data-copy="skip">跳到正文</a>
  <header class="site-header">
    <nav class="container site-nav" aria-label="主导航">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Z</span><span>臻一</span></a>
      <div class="nav-links">
        <a href="projects.html" data-copy="projects">项目</a>
        <a href="index.html#contact" data-copy="contact">联系</a>
      </div>
      <div class="lang-switch" aria-label="Language">
        <button type="button" lang="zh-CN" data-lang-button="zh" aria-pressed="true">中</button>
        <button type="button" lang="en" data-lang-button="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </header>

  <main id="main" class="container project-main" tabindex="-1">
    <a class="back-link" href="projects.html" data-project-label="back">返回项目列表</a>
    <div class="project-overview">
      <header class="project-heading">
        <p id="projectType" class="project-type"></p>
        <h1 id="projectName"></h1>
        <p id="projectSummary" class="project-summary"></p>
        <div id="projectActions" class="project-actions" hidden></div>
        <div id="projectLaunch" class="project-launch" hidden>
          <img id="projectLaunchQr" alt="" width="110" height="110" decoding="async">
          <div>
            <span id="projectLaunchLabel"></span>
            <strong id="projectLaunchText"></strong>
          </div>
        </div>
      </header>

      <section id="projectVisualSection" class="project-visual" hidden>
        <div class="project-carousel" id="projectCarousel" tabindex="0" role="group" aria-label="项目截图轮播">
          <div class="carousel-viewport">
            <div class="carousel-track" id="projectCarouselTrack"></div>
          </div>
          <div class="carousel-bar">
            <p id="projectCarouselCaption" aria-live="polite"></p>
            <div class="carousel-tools">
              <div class="carousel-controls">
                <button type="button" id="carouselPrev" aria-label="上一张">←</button>
                <span id="carouselCount"></span>
                <button type="button" id="carouselNext" aria-label="下一张">→</button>
              </div>
              <button type="button" class="carousel-expand" id="carouselExpand" aria-haspopup="dialog" aria-controls="projectImageDialog">
                <span data-project-label="expand">查看大图</span><span aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
          <div class="carousel-thumbnails" id="carouselThumbnails" role="group" aria-label="截图缩略图" hidden></div>
        </div>
      </section>
    </div>

    <dl id="projectFacts" class="project-facts"></dl>
    <div id="projectCurrent" class="project-current" hidden>
      <h2 id="projectCurrentTitle"></h2>
      <p id="projectCurrentText"></p>
    </div>

    <section class="project-story">
      <article class="detail-block">
        <h2 data-project-label="challenge">要解决的问题</h2>
        <p id="projectChallenge"></p>
      </article>
      <article class="detail-block">
        <h2 data-project-label="approach">怎么做</h2>
        <p id="projectApproach"></p>
      </article>
      <article class="detail-block detail-evidence">
        <h2 data-project-label="evidence">已有产物</h2>
        <ul id="projectEvidence"></ul>
      </article>
    </section>

    <section id="moduleSection" class="module-section" aria-labelledby="moduleTitle" hidden>
      <header>
        <h2 id="moduleTitle"></h2>
        <p id="moduleIntro"></p>
      </header>
      <div id="moduleList" class="module-list"></div>
    </section>

    <section class="next-section">
      <a id="nextProject" class="next-project" href="projects.html">
        <span id="nextProjectLabel">下一个项目</span>
        <strong id="nextProjectName"></strong>
        <span class="next-arrow" aria-hidden="true">→</span>
      </a>
      <a class="text-link" href="index.html#contact" data-project-label="contact">联系合作</a>
    </section>
  </main>

  <dialog id="projectImageDialog" class="project-image-dialog" aria-labelledby="imageDialogTitle">
    <header class="image-dialog-header">
      <h2 id="imageDialogTitle" aria-live="polite"></h2>
      <button type="button" id="imageDialogClose" aria-label="关闭大图" autofocus>×</button>
    </header>
    <img id="imageDialogImage" alt="" decoding="async">
    <div class="carousel-controls image-dialog-controls" id="imageDialogControls" hidden>
      <button type="button" id="imageDialogPrev" aria-label="上一张">←</button>
      <span id="imageDialogCount"></span>
      <button type="button" id="imageDialogNext" aria-label="下一张">→</button>
    </div>
  </dialog>

  <script src="projects-data.js?v=20261120"></script>
  <script src="site.js?v=20261120"></script>
  <script src="project.js?v=20261120"></script>
</body>
</html>
