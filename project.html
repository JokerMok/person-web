<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="臻一人工智能实验室项目档案。">
  <title>Project | Zhenyi</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span>臻一 / Zhenyi</span>
        <small>Project Archive</small>
      </a>
      <div class="nav-links">
        <a href="index.html#enterprise" data-copy="navEnterprise">企业实践</a>
        <a href="index.html#lab" data-copy="navLab">产品实验</a>
        <a href="index.html#archive" data-copy="navArchive">档案</a>
        <a href="index.html#contact" data-copy="navContact">联系</a>
      </div>
      <div class="lang-switch" aria-label="Language">
        <button type="button" data-lang-button="zh" aria-pressed="true">中</button>
        <button type="button" data-lang-button="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>

  <main>
    <section class="project-hero">
      <div class="container project-hero-grid">
        <div>
          <span id="projectType" class="project-type"></span>
          <h1 id="projectName"></h1>
          <p id="projectSummary" class="project-summary"></p>
        </div>
        <aside id="projectFacts" class="project-facts"></aside>
      </div>
    </section>

    <section id="projectVisualSection" class="project-visual-section" hidden>
      <div class="container">
        <figure class="project-visual">
          <img id="projectImage" alt="" decoding="async">
          <figcaption id="projectImageLabel"></figcaption>
        </figure>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="detail-grid">
          <article class="detail-block">
            <small>01</small>
            <h2 data-project-label="challenge">要解决的问题</h2>
            <p id="projectChallenge"></p>
          </article>
          <article class="detail-block">
            <small>02</small>
            <h2 data-project-label="approach">怎么做</h2>
            <p id="projectApproach"></p>
          </article>
          <article class="detail-block">
            <small>03</small>
            <h2 data-project-label="evidence">已有产物</h2>
            <ul id="projectEvidence"></ul>
          </article>
        </div>
      </div>
    </section>

    <section id="moduleSection" class="section" hidden>
      <div class="container">
        <header class="section-head">
          <span class="section-index">04 / SUITE</span>
          <h2 id="moduleTitle"></h2>
          <p id="moduleIntro"></p>
        </header>
        <div id="moduleList" class="module-list"></div>
      </div>
    </section>

    <div class="container back-row">
      <a class="button" href="index.html#enterprise" data-project-label="back">返回项目列表</a>
      <a class="button primary" href="index.html#contact" data-project-label="contact">联系合作</a>
    </div>
  </main>

  <script src="projects-data.js"></script>
  <script src="site.js"></script>
  <script src="project.js"></script>
</body>
</html>
